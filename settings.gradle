pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
    }
}

dependencyResolutionManagement {
    // PREFER_PROJECT allows Kotlin/JS plugin to add Node.js and Yarn repositories
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
}

rootProject.name = "SceneView"

// Core SceneView modules.
include ":sceneview-core"
include ":sceneview"
include ":arsceneview"

// Documentation/snippet compile guard.
include ":snippets-check"
project(":snippets-check").projectDir = file("tools/snippets-check")

// Android sample modules.
include ":samples:common"
include ":samples:android-demo"
include ":samples:android-tv-demo"

// Intentionally excluded because these directories are not present
// in this customized Android GLB Viewer repository:
//
// :sceneview-web
// :sceneview-compose
// :samples:desktop-demo
//
// Web, Flutter, React Native and iOS demos are not required for
// the Android GLB Viewer APK.
