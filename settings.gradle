pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
}

rootProject.name = "SceneView"

/*
 * Modules that actually exist in this customized repository.
 */
include ":common"
include ":sceneview-core"
include ":sceneview"

/*
 * Modules intentionally NOT included because their directories
 * are not present in this repository:
 *
 * :arsceneview
 * :sceneview-web
 * :sceneview-compose
 * :snippets-check
 * :samples:common
 * :samples:android-demo
 * :samples:android-tv-demo
 * :samples:desktop-demo
 */
