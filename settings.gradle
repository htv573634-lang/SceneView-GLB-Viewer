pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
    }
}

dependencyResolutionManagement {
    // PREFER_PROJECT allows Kotlin/JS plugin to add Node.js and Yarn repositories
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
}

rootProject.name = "SceneView"

include ":sceneview-core"
include ":sceneview"
include ":arsceneview"
include ":sceneview-web"

// Compose Multiplatform façade over the per-platform renderers
include ":sceneview-compose"

// Doc-snippet compile guard
include ":snippets-check"
project(":snippets-check").projectDir = file("tools/snippets-check")

// Samples that are part of this repository
include ":samples:common"
include ":samples:android-demo"
include ":samples:android-tv-demo"

// The desktop demo is intentionally not included because
// samples/desktop-demo does not exist in this repository.

// Web demo:
// samples/web-demo/ is a static site and is not a Gradle module.

// Flutter demo:
// samples/flutter-demo/ is Dart and is not a Gradle module.

// React Native demo:
// samples/react-native-demo/ is JavaScript and is not a Gradle module.

// iOS demo:
// samples/ios-demo/ is an Xcode project and is not a Gradle module.
