pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
    }
}

dependencyResolutionManagement {
    // PREFER_PROJECT allows Kotlin/JS plugin to add Node.js and Yarn repositories
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
}

rootProject.name = "SceneView"

// Core SceneView modules used by the Android application.
include ":sceneview-core"
include ":sceneview"
include ":arsceneview"

// Compose Multiplatform façade.
include ":sceneview-compose"

// Documentation/snippet compile guard.
include ":snippets-check"
project(":snippets-check").projectDir = file("tools/snippets-check")

// Android sample modules.
include ":samples:common"
include ":samples:android-demo"
include ":samples:android-tv-demo"

// Not included:
// :sceneview-web      -> directory is not present in this repository.
// :samples:desktop-demo -> directory is not present in this repository.
//
// The repository also contains non-Gradle demos such as Web,
// Flutter, React Native and iOS, which are not required for this
// Android GLB Viewer APK.
