name: Build SceneView GLB Viewer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout our actual repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Use the Java version required by this project
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 3. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 4. Build our custom Android application
      - name: Build GLB Viewer APK
        run: |
          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 5. Upload the generated APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SceneView-GLB-Viewer
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
