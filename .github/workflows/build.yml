name: Build SceneView Android Demo

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4

      - name: Clone official SceneView
        run: |
          git clone \
            --depth 1 \
            --branch v4.37.0 \
            https://github.com/SceneView/sceneview.git \
            sceneview

      - name: Setup Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"

      - name: Make Gradle executable
        run: chmod +x sceneview/gradlew

      - name: Build Android Demo APK
        working-directory: sceneview
        run: |
          ./gradlew \
            :samples:android-demo:assembleDebug \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SceneView-Android-Demo
          path: sceneview/samples/android-demo/build/outputs/apk/debug/*.apk
          if-no-files-found: error
