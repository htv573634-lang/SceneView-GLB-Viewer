name: Bootstrap 2A - Analyze SceneView Android Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Clone SceneView
        run: |
          git clone \
            --depth 1 \
            --branch v4.37.0 \
            https://github.com/SceneView/sceneview.git \
            sceneview

      - name: Analyze Android Demo build files
        run: |
          echo "================ ROOT FILES ================"
          find sceneview -maxdepth 1 | sort

          echo
          echo "================ GRADLE ROOT ================"
          find sceneview -maxdepth 2 \
            \( -name "*.gradle*" -o -name "gradle.properties" -o -name "settings.gradle.kts" \) \
            | sort

          echo
          echo "================ ANDROID DEMO ================"
          find sceneview/samples/android-demo | sort

          echo
          echo "================ SCENEVIEW MODULE ================"
          find sceneview/sceneview | sort

          echo
          echo "================ ARSCENEVIEW MODULE ================"
          find sceneview/arsceneview | sort

          echo
          echo "================ REQUIRED MANIFESTS ================"
          find sceneview \
            -name "AndroidManifest.xml" \
            | sort

          echo
          echo "================ REQUIRED JNI LIBS ================"
          find sceneview \
            -path "*/jniLibs/*" \
            | sort

          echo
          echo "================ REQUIRED AAR/JAR ================"
          find sceneview \
            \( -name "*.aar" -o -name "*.jar" \) \
            | sort

          echo
          echo "================ ANDROID DEMO ASSETS ================"
          find sceneview/samples/android-demo/src/main/assets | sort

          echo
          echo "================ ANDROID DEMO RES ================"
          find sceneview/samples/android-demo/src/main/res | sort
