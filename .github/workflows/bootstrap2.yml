name: Bootstrap 3 - Needed Files Only

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Clone SceneView
        run: |
          git clone --depth 1 https://github.com/SceneView/sceneview.git sceneview

      - name: Show only required files
        run: |
          cd sceneview

          echo "================ ROOT BUILD FILES ================"
          find . -maxdepth 1 -type f | sort

          echo
          echo "================ GRADLE WRAPPER ================"
          find gradle -type f | sort
          find . -maxdepth 1 -name "gradlew*" | sort

          echo
          echo "================ ANDROID DEMO ================"
          find samples/android-demo -type f | sort

          echo
          echo "================ COMMON SAMPLE ================"
          find samples/common -type f | sort

          echo
          echo "================ SCENEVIEW LIBRARY ================"
          find sceneview/src -type f | sort

          echo
          echo "================ SCENEVIEW CORE ================"
          find sceneview-core/src -type f | sort

          echo
          echo "================ ARSCENEVIEW ================"
          find arsceneview/src -type f | sort

          echo
          echo "================ REQUIRED BUILD FILES ================"
          find . \( -name "build.gradle.kts" -o -name "settings.gradle.kts" -o -name "gradle.properties" -o -name "libs.versions.toml" \) | sort
