name: Bootstrap 2 - Extract Android Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4

      - name: Clone official SceneView
        run: |
          git clone \
            --depth 1 \
            --branch v4.37.0 \
            https://github.com/SceneView/sceneview.git \
            sceneview

      - name: Extract Android Demo
        run: |
          mkdir -p export
          cp -R sceneview/samples/android-demo export/app

          cp sceneview/settings.gradle.kts export/ || true
          cp sceneview/build.gradle.kts export/ || true
          cp sceneview/gradle.properties export/ || true
          cp sceneview/gradlew export/ || true
          cp -R sceneview/gradle export/ || true

      - name: Show extracted files
        run: |
          find export -maxdepth 3 -type f | sort

      - name: Upload Android Demo Source
        uses: actions/upload-artifact@v4
        with:
          name: SceneView-Android-Demo-Source
          path: export
          if-no-files-found: error
